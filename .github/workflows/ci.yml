name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages
      - run: flutter analyze
      - run: flutter test
      - name: Test the design package
        working-directory: packages/piligrim_design
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android-bundle:
    name: Android release build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      # Signed with the debug key: this job proves the release build works.
      # Signing for Play happens only in release.yml, which holds the secrets.
      - name: Build the app bundle
        run: flutter build appbundle --release --build-number "${{ github.run_number }}"
      - name: Check the base download size
        run: |
          size=$(stat -c %s build/app/outputs/bundle/release/app-release.aab)
          echo "Bundle is $((size / 1024 / 1024)) MB"
          echo "::notice::app-release.aab is $((size / 1024 / 1024)) MB (the bundle holds every ABI; the download per phone is smaller)"
      - uses: actions/upload-artifact@v4
        with:
          name: piligrim-unsigned-check-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
