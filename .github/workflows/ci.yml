name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages
      - run: flutter analyze
      - run: flutter test
      - name: Test the design package
        working-directory: packages/piligrim_design
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android-bundle:
    name: Android release bundle
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generate database code
        run: dart run build_runner build
      # With the four ANDROID_* secrets set, the bundle is signed with the
      # upload key and can go to Play. Without them it is signed with the
      # debug key: good for checking that the build works, not for upload.
      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No upload keystore secret. Building a debug-signed bundle."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build the app bundle
        run: flutter build appbundle --release --build-number "${{ github.run_number }}"
      - name: Check the base download size
        run: |
          size=$(stat -c %s build/app/outputs/bundle/release/app-release.aab)
          echo "Bundle is $((size / 1024 / 1024)) MB"
          echo "::notice::app-release.aab is $((size / 1024 / 1024)) MB (the bundle holds every ABI; the download per phone is smaller)"
      - uses: actions/upload-artifact@v4
        with:
          name: piligrim-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
