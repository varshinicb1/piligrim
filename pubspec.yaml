name: piligrim
description: "Piligrim, a devotional journey companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  cupertino_ui: ^1.1.6
  flutter_svg: ^2.0.0
  piligrim_design:
    path: packages/piligrim_design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/ayyappa_deeksha/
    - assets/content/ayyappa_deeksha/strings/
    - assets/companion/

# Bundle SQLite3 Multiple Ciphers instead of plain SQLite, so the local
# database can be encrypted at rest. See lib/core/db/encrypted_executor.dart.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
